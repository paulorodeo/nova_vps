services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: topleo/construtora-nova:latest
    container_name: construtora-nova
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      VITE_SITE_URL: ${VITE_SITE_URL:-https://construtora-topleo.lovable.app}
    ports:
      # Exposto apenas no loopback: o proxy reverso (Nginx/OpenLiteSpeed) publica o site
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
