services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: topleo/construtora-nova:latest
    container_name: construtora-nova
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      VITE_SITE_URL: ${VITE_SITE_URL:-https://construtora-topleo.lovable.app}
    ports:
      # Exposto apenas no loopback: o proxy reverso (Nginx/OpenLiteSpeed) publica o site
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      # wget faz parte do busybox da imagem node:24-alpine
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
